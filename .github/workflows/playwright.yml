name: 🤖 Daily Playwright Tests — mslb.nooreharam.com

on:
  # Run every day at 7:00 AM IST (1:30 AM UTC)
  schedule:
    - cron: '30 1 * * *'

  # Also run on every push to main
  push:
    branches: [main]

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  test:
    name: Run All Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🌐 Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: 🧪 Run Core Tests (Chrome)
        run: npx playwright test --project="Desktop Chrome" --reporter=list
        continue-on-error: false

      - name: ⚡ Run Performance Tests
        run: npx playwright test --project="Performance" --reporter=list
        continue-on-error: true

      - name: ♿ Run Accessibility Tests (axe)
        run: npx playwright test --project="Accessibility" --reporter=list
        continue-on-error: true

      - name: 🌍 Run Multi-Language Tests
        run: npx playwright test --project="Multi-Language" --reporter=list
        continue-on-error: true

      - name: 🌐 Cross-Browser — Firefox
        run: npx playwright test tests/madrasa.spec.js --project="Desktop Firefox" --reporter=list
        continue-on-error: true

      - name: 🌐 Cross-Browser — Safari (WebKit)
        run: npx playwright test tests/madrasa.spec.js --project="Desktop Safari" --reporter=list
        continue-on-error: true

      - name: 📱 Mobile Tests — iPhone
        run: npx playwright test tests/madrasa.spec.js --project="iPhone 13" --reporter=list
        continue-on-error: true

      - name: 📱 Mobile Tests — Samsung
        run: npx playwright test tests/madrasa.spec.js --project="Samsung Galaxy S21" --reporter=list
        continue-on-error: true

      - name: 📊 Upload Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.run_number }}
          path: |
            test-results/report/
            test-results/screenshots/
          retention-days: 30

      - name: 📊 Upload failure artifacts (videos/traces)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failure-artifacts-${{ github.run_number }}
          path: test-results/artifacts/
          retention-days: 7
